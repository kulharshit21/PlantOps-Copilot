name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Frontend lint
        run: npm run lint
        working-directory: apps/web

      - name: Frontend build
        run: npm run build
        working-directory: apps/web

      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Backend tests
        run: python -m pytest apps/api/tests

      - name: RAG citation smoke eval
        run: python evals/rag/run_rag_smoke.py

      - name: Role permission smoke eval
        run: python evals/security/role_permission_smoke.py

      - name: Secret grep smoke eval
        run: python evals/security/secret_grep.py

      - name: SQL seed sanity check
        run: |
          python - <<'PY'
          from pathlib import Path
          seed = Path("supabase/seed.sql").read_text()
          assert "insert into public.document_chunks" in seed
          assert "title," in seed
          assert "source_uri" in seed
          assert "source_page" in seed
          print("seed sanity ok")
          PY

      - name: Docker Compose config
        run: docker compose config

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
