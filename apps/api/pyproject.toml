[project]
name = "plantops-api"
version = "0.1.0"
description = "FastAPI backend for PlantOps Copilot."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.124.0",
  "pydantic-settings>=2.12.0",
  "uvicorn[standard]>=0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0"
]
ml = [
  "joblib>=1.4.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
